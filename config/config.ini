eos-vm-oc-enable = 1
chain-state-db-size-mb = 200
verbose-http-errors = true
allowed-connection = any
p2p-max-nodes-per-host = 10

plugin = eosio::chain_api_plugin
plugin = eosio::chain_plugin
plugin = eosio::http_plugin
## Enable for producer node
plugin = eosio::producer_plugin
plugin = eosio::producer_api_plugin
plugin = eosio::net_plugin
plugin = eosio::net_api_plugin
plugin = eosio::db_size_api_plugin

disable-replay-opts = true
read-only-read-window-time-us = 165000
read-only-write-window-time-us = 50000

# stop processes when disk space is 98% 
# default is too low
resource-monitor-space-threshold = 98
# DONT VALIDATE HOSTS
# OK when behind nginx proxy or firewall blocks
http-validate-host = false
# BLOCK LOG FILES
# Splits blocks log into chunks of this many blocks and moves older log files to retained dir
blocks-log-stride = 250000