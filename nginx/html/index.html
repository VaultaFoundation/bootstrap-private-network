<!DOCTYPE html>
<html>
<head>
    <title>Key Creator</title>
</head>
<body>
    <h1>Vaulta Key Generator</h1>
    <button onclick="createKeys()">Create Keys</button>

    <script>
        function createKeys() {
            fetch('/service/create_keys', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.output) {
                        alert("Output:\n" + data.output);
                    } else {
                        alert("Error:\n" + (data.error || "Unknown error"));
                    }
                })
                .catch(error => {
                    alert("Error calling server: " + error);
                });
        }
    </script>
</body>
</html>
